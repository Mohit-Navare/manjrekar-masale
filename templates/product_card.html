<article class="product-card">
    <a class="product-image" href="{{ url_for('product_detail', product_id=product.id) }}" style="--product-color: {{ product.color }}">
        <span class="product-badge">{{ product.badge }}</span>
        <span class="product-emoji">{{ product.icon }}</span>
        <span class="product-type">{{ product.category }}</span>
    </a>
    <div class="product-info">
        <div><span class="product-meta">{{ product.unit }}</span><h3><a href="{{ url_for('product_detail', product_id=product.id) }}">{{ product.name }}</a></h3></div>
        <div class="product-price">₹{{ product.price }}</div>
        <form class="quick-add" method="post" action="{{ url_for('add_to_cart') }}">
            <input type="hidden" name="product_id" value="{{ product.id }}"><input type="hidden" name="quantity" value="1">
            <button class="add-btn" type="submit">Add to cart <span>+</span></button>
        </form>
    </div>
</article>
